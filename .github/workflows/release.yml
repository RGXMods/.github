name: RGX Release

# Reusable release pipeline for RGX addons.
#
# Call it from an addon repository:
#
#   jobs:
#     release:
#       uses: RGXMods/.github/.github/workflows/release.yml@main
#       secrets: inherit
#
# The caller owns the trigger (tag push / manual dispatch). This workflow owns
# everything after that:
#
#   * reads the version from the addon TOC
#   * refuses a tag that does not match the TOC version
#   * builds the GitHub release with BigWigsMods/packager
#   * posts the Discord release card
#
# CurseForge is deliberately not uploaded here. The CurseForge project is set
# to "package any new tagged commits it sees", so CurseForge builds its own
# file from the tag and a second upload here would duplicate it.
#
# Wago stays opt-in: it only runs when the WAGO_API_TOKEN secret exists.
#
# Required secrets (set on the addon repository):
#   GITHUB_TOKEN         - provided by Actions
#   DISCORD_WEBHOOK      - optional, release card
#   WAGO_API_TOKEN       - optional, Wago upload
#
# Required repository variable:
#   ADDON_NAME           - folder name under Interface/AddOns (e.g. RGXProfessions)

on:
  workflow_call:
    inputs:
      release_type:
        description: Override the release channel (release, beta, alpha)
        required: false
        type: string
        default: ''
      discord:
        description: Post the Discord release card
        required: false
        type: boolean
        default: true
    secrets:
      DISCORD_WEBHOOK:
        required: false
      WAGO_API_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git user
        run: |
          git config --global user.name "RGX Mods"
          git config --global user.email "releases@rgxmods.com"

      - name: Read addon metadata
        id: meta
        shell: bash
        run: |
          addon="${ADDON_NAME:-}"
          if [[ -z "$addon" ]]; then
            echo "::error::Repository variable ADDON_NAME is not set."
            exit 1
          fi
          toc="${addon}.toc"
          if [[ ! -f "$toc" ]]; then
            echo "::error::$toc not found."
            exit 1
          fi

          version="$(grep -oP '^## Version:\s*\K.*' "$toc" || true)"
          if [[ -z "$version" ]]; then
            echo "::error::$toc has no ## Version."
            exit 1
          fi

          echo "addon=$addon" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"
          echo "Resolved $addon $version"

      - name: Verify tag matches the TOC
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${{ steps.meta.outputs.version }}"
          if [[ "${tag#v}" != "${version#v}" && "${tag%%-*}" != "${version#v}" ]]; then
            echo "::error::Tag '$tag' does not match TOC version '$version'."
            exit 1
          fi

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          short="${version#v}"
          if [[ -f "docs/changelogs/${short}.md" ]]; then
            body="$(cat "docs/changelogs/${short}.md")"
          elif [[ -f "docs/CHANGES.md" ]]; then
            body="$(awk '/^## / { if (started) exit; started=1 } started' docs/CHANGES.md)"
          else
            body="No changelog available."
          fi

          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          summary="$(echo "$body" | grep -E '^[-*]|^\*\*' | head -20 | sed 's/^\*\*[^*]*\*\*[[:space:]]*//')"
          if ((${#summary} > 980)); then
            summary="${summary:0:977}..."
          fi
          {
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Release notes
        run: |
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Channel: ${{ inputs.release_type || 'release' }}"
          echo "CurseForge packages tagged commits on its own; no upload here."

      - name: Discord notification
        if: ${{ inputs.discord && success() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SUMMARY: ${{ steps.changelog.outputs.summary }}
          VERSION: ${{ steps.meta.outputs.version }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && exit 0

          channel="${{ inputs.release_type || 'release' }}"
          case "$channel" in
            beta)  colour=16744448; label="Beta Build" ;;
            alpha) colour=9109504;  label="Alpha Build" ;;
            *)     colour=35071;    label="Stable Release" ;;
          esac

          url="https://github.com/${REPO}/releases/tag/${{ github.ref_name }}"

          jq -n \
            --arg title "RGX | ${{ steps.meta.outputs.addon }} ${VERSION}" \
            --arg url "$url" \
            --arg description "A new ${label,,} is live." \
            --arg summary "$SUMMARY" \
            --arg footer "RGX Mods • ${label}" \
            --arg timestamp "$TIMESTAMP" \
            --argjson colour "$colour" \
            '{username: "RGX Releases",
              embeds: [{title: $title, url: $url, description: $description,
                        color: $colour,
                        fields: [{name: "What''s New", value: ($summary // "See the release page."), inline: false}],
                        footer: {text: $footer}, timestamp: $timestamp}]}' > payload.json

          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "Content-Type: application/json" -X POST -d @payload.json "$DISCORD_WEBHOOK"
