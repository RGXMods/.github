name: probe shared v2
on:
  workflow_call:
    inputs:
      release_type:
        description: Override the release channel
        required: false
        type: string
        default: ''
      discord:
        description: Post the Discord release card
        required: false
        type: boolean
        default: true
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: echo "type=${{ inputs.release_type }} discord=${{ inputs.discord }}"
